name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Verify plugin and CLI release versions match
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PLUGIN_VERSION=$(python -c 'import json; print(json.load(open("plugins/better-colab/.codex-plugin/plugin.json"))["version"])')
          test "$RELEASE_TAG" = "v$PLUGIN_VERSION"
      - run: uv run python tools/package_plugin.py check
      - run: uv run python tools/package_plugin.py build --out-dir dist
      - run: uv build --out-dir dist
      - name: Verify the core wheel's private kernel-client boundary
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/better_google_colab_cli-*.whl
          .wheel-smoke/bin/python -c 'import importlib.metadata as m; import jupyter_kernel_client as j; from jupyter_kernel_client.wsclient import JupyterSubprotocol, KernelWebSocketClient; assert m.version("jupyter-kernel-client") == "1.0.1"; client = KernelWebSocketClient(endpoint="ws://invalid.example/channels", subprotocol=JupyterSubprotocol.DEFAULT, headers={"X-Test": "value"}, extra_params={"runtime-token": "value"}); assert hasattr(j, "JupyterKernelClient"); assert hasattr(client, "_shell_msg_queue"); assert client._headers == {"X-Test": "value"}; assert client._extra_params == {"runtime-token": "value"}'
      - run: uv build compat --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: better-colab-plugin
          path: dist/better-colab-plugin-*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/better-google-colab-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
